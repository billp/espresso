name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Python syntax
        run: python3 -m py_compile mmctl/mm.py mmctl/mmctl.py

      - name: Check shell syntax
        run: bash -n install.sh
